[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "BIU DS23 team 8 - Travel Agent: rules baseline vs single agent vs multi-agent (CrewAI Flow)"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pydantic>=2.7",
  "pandas>=2.0",
]

[project.optional-dependencies]
agents = ["crewai>=1.15,<1.16"]
ui = ["streamlit>=1.40", "pydeck>=0.9"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
